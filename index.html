<!-- 네이버 서치어드바이저 소유확인 메타태그를 이 아래에 붙여넣으세요 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f5c4a'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1d1f22;--sub:#5b6068;--line:#e3e5e8;--bg:#f6f6f4;--accent:#0f5c4a;--accent-soft:#e7f1ee}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:32px 16px 60px}
  h1{font-size:24px;margin:0 0 6px;letter-spacing:-.4px}
  .lead{color:var(--sub);margin:0 0 24px;font-size:15px}
  a.tool{display:block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:10px;text-decoration:none;color:inherit;transition:border-color .15s}
  a.tool:hover,a.tool:focus-visible{border-color:var(--accent)}
  .cat{font-size:12px;font-weight:500;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:4px}
  .tool h2{font-size:17px;margin:8px 0 4px}
  .tool p{margin:0;color:var(--sub);font-size:14px}
  .soon{border:1px dashed #cfd3d8;border-radius:8px;padding:14px 16px;color:var(--sub);font-size:14px}
  footer{margin-top:28px;font-size:12.5px;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <h1>생활·업무 무료 도구 모음</h1>
  <p class="lead">설치 없이 브라우저에서 바로 씁니다. 입력한 내용은 서버로 전송되지 않습니다.</p>

  <a class="tool" href="review-policy/">
    <span class="cat">쇼핑몰 운영</span>
    <h2>리뷰 운영정책 고지문 생성기</h2>
    <p>2026년 개정 전자상거래법 리뷰 공개 의무 대응. 질문 6개에 답하면 고지문과 HTML 코드가 완성됩니다.</p>
  </a>

  <div class="soon">새 도구를 준비하고 있습니다.</div>

  <footer>모든 도구는 참고용이며 법률·세무 자문을 대신하지 않습니다.</footer>
</div>
<!-- 앱 관제 오비트 이용자 카운터 (방문 수만 집계, 입력 내용·개인정보 전송 없음) -->
<script async src="https://gurifire.github.io/orbit/track.js"></script>
</body>
</html>
