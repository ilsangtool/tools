name: "법령 기준값 자동 점검"

on:
  schedule:
    - cron: '17 0 * * 1,4'   # 매주 월·목 오전 9시 17분 (한국시간)
  workflow_dispatch:          # Actions 탭에서 'Run workflow'로 바로 실행
  push:
    branches: [main]
    paths:
      - '_build/**'
      - 'data/rules.json'
      - 'data/wage-table.json'
      - '.github/workflows/law-watch.yml'

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: law-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "PDF 글자 추출 도구 (간이세액표 별표 원문 읽기용)"
        if: github.event_name != 'push'
        run: sudo apt-get install -y -qq poppler-utils >/dev/null || true

      - name: "법령·기준값 점검 (뉴스 교차확인 + 선택: 국가법령정보센터)"
        if: github.event_name != 'push'
        env:
          HOLIDAY_KEY: ${{ secrets.HOLIDAY_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAW_OC: ${{ secrets.LAW_OC }}
          LAW_API_OC: ${{ secrets.LAW_API_OC }}
          TZ: Asia/Seoul
        run: python _build/law_watch.py

      - name: "도구 페이지 다시 만들기 (rules.json 값·날짜 반영)"
        env:
          TZ: Asia/Seoul
        run: python _build/build.py

      - name: "바뀐 내용 저장"
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "ilsangtool-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "법령 기준값 자동 점검 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
            # 봇이 올린 커밋은 Pages 배포가 자동으로 안 걸릴 수 있어 직접 요청
            curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          else
            echo "변경 없음"
          fi
