  <div class="tabwrap" id="main">
    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="limit">대출 한도</button>
      <button type="button" data-tab="income">필요 연봉·살 수 있는 집값</button>
      <button type="button" data-tab="loans">대출 계산기</button>
      <button type="button" data-tab="cost">취득 비용</button>
      <button type="button" data-tab="rent">전월세 전환</button>
    </div>

    <section class="card shared">
      <h2><span class="num">1</span>집과 나의 조건 <small class="sub">모든 탭에 함께 쓰입니다</small></h2>
      <div class="row">
        <div><label class="f" for="price">주택 가격 (시가·매매가)</label><input type="text" id="price" class="m" inputmode="numeric" placeholder="예: 900,000,000"><div class="kor" id="priceKor"></div></div>
        <div><label class="f" for="region">주택 소재지</label><select id="region"></select><div class="tagline" id="regionTag"></div></div>
      </div>
      <label class="f">주택 보유 (이번에 사는 집 빼고)</label>
      <div class="radio-group" id="owner">
        <label><input type="radio" name="owner" value="first" checked><span>생애최초 (무주택·첫 구입)</span></label>
        <label><input type="radio" name="owner" value="none"><span>무주택 (구입 이력 있음)</span></label>
        <label><input type="radio" name="owner" value="oneSell"><span>1주택 (기존 집 처분 조건)</span></label>
        <label><input type="radio" name="owner" value="multi"><span>1주택 이상 추가 구입</span></label>
      </div>
      <div class="row">
        <div><label class="f" for="income">연소득 (세전, 부부 합산 가능)</label><input type="text" id="income" class="m" inputmode="numeric" placeholder="예: 60,000,000"><div class="kor" id="incomeKor"></div></div>
        <div><label class="f">대출 받을 곳</label>
          <div class="radio-group"><label><input type="radio" name="sector" value="bank" checked><span>은행 (DSR 40%)</span></label><label><input type="radio" name="sector" value="nonbank"><span>보험·저축은행 등 (50%)</span></label></div></div>
      </div>
      <div class="row3">
        <div><label class="f" for="rate">대출 금리 (연 %)</label><input type="number" id="rate" step="0.01" inputmode="decimal" value="4.2"></div>
        <div><label class="f" for="term">만기 (년)</label><input type="number" id="term" min="1" max="50" value="30" inputmode="numeric"></div>
        <div><label class="f" for="method">상환 방식</label><select id="method"><option value="annuity">원리금균등</option><option value="equal">원금균등</option></select></div>
      </div>
      <div class="row3">
        <div><label class="f" for="rtype">금리 유형</label><select id="rtype"><option value="var">변동금리</option><option value="mixed" selected>혼합형 (고정 후 변동)</option><option value="periodic">주기형 (일정 주기로 변경)</option><option value="fixed">전 기간 고정</option></select></div>
        <div id="fyBox"><label class="f" for="fyears">고정 기간·변동 주기 (년)</label><input type="number" id="fyears" min="1" max="50" value="5" inputmode="numeric"></div>
        <div><label class="f" for="other">기존 대출 연간 원리금 <small>(직접 입력)</small></label><input type="text" id="other" class="m" inputmode="numeric" placeholder="대출 계산기 탭 값을 쓰면 비워 두세요"></div>
      </div>
      <p class="hint" id="otherInfo"></p>
    </section>

    <!-- 대출 한도 -->
    <div data-pane="limit">
      <section class="card">
        <h2>주택담보대출 한도</h2>
        <div class="stat" id="lStat"></div>
        <div class="bars" id="lBars"></div>
        <table class="t" id="lTbl"></table>
        <div id="lNotes" class="notes"></div>
        <div class="actions"><button type="button" id="lCopy">결과 복사</button></div>
      </section>
    </div>

    <!-- 필요 연봉 -->
    <div data-pane="income" class="hidden">
      <section class="card">
        <h2><span class="num">2</span>받고 싶은 대출에 필요한 연봉</h2>
        <label class="f" for="want">받고 싶은 대출 금액</label>
        <input type="text" id="want" class="m" inputmode="numeric" placeholder="예: 400,000,000">
        <div class="quick" id="wantQuick"></div>
        <div class="stat" id="iStat"></div>
        <table class="t" id="iTbl"></table>
      </section>
      <section class="card">
        <h2><span class="num">3</span>내 연봉·현금으로 살 수 있는 집값</h2>
        <label class="f" for="cash">쓸 수 있는 현금 (자기자금)</label>
        <input type="text" id="cash" class="m" inputmode="numeric" placeholder="예: 300,000,000">
        <label class="chk"><input type="checkbox" id="cashCost" checked><span>취득세·중개보수 등 부대비용도 현금에서 낸다고 보고 계산</span></label>
        <div class="stat" id="aStat"></div>
        <p class="hint" id="aNote"></p>
      </section>
    </div>

    <!-- 대출 계산기 -->
    <div data-pane="loans" class="hidden">
      <section class="card">
        <h2><span class="num">2</span>내 대출 목록</h2>
        <p class="hint">주담대·신용·전세·마이너스·자동차 등 대출을 각각 조건대로 넣으면 상환표와 합계가 나옵니다. 「DSR」을 체크한 대출은 대출 한도·필요 연봉 계산의 기존 대출로 들어갑니다.</p>
        <div class="filters"><input type="search" id="lq" placeholder="대출 이름·종류로 찾기" aria-label="대출 찾기"><select id="lkind" aria-label="종류로 거르기"><option value="">모든 종류</option></select></div>
        <div class="tbl-wrap"><table class="t loans" id="loanTbl"></table></div>
        <label class="chk"><input type="checkbox" id="jeonseDsr"><span>전세대출 이자도 DSR에 넣기 (수도권·규제지역 1주택자가 받은 전세대출)</span></label>
        <div class="actions"><button type="button" class="ghost sm" id="loanAdd">대출 추가</button></div>
        <div class="stat" id="sumStat"></div>
      </section>
      <section class="card" id="schedCard">
        <h2><span class="num">3</span>상환표 <small class="sub" id="schedName"></small></h2>
        <div class="stat" id="schedStat"></div>
        <div class="tbl-wrap"><table class="t" id="cmpTbl"></table></div>
        <div class="period"><select id="schedView" aria-label="표 보기"><option value="m">월별</option><option value="y">연도별</option></select></div>
        <div class="tbl-wrap sched"><table class="t" id="schedTbl"></table></div>
        <div class="actions"><button type="button" class="ghost" id="schedCsv">상환표 엑셀(CSV)</button></div>
      </section>
    </div>

    <!-- 취득 비용 -->
    <div data-pane="cost" class="hidden">
      <section class="card">
        <h2><span class="num">2</span>세금·수수료 조건</h2>
        <div class="row">
          <div><label class="f" for="houses">이번 집까지 합친 주택 수 (세대 기준)</label><select id="houses"><option value="1">1주택</option><option value="2">2주택</option><option value="3">3주택</option><option value="4">4주택 이상</option></select></div>
          <div><label class="f" for="area">전용면적</label><select id="area"><option value="s">85㎡ 이하</option><option value="l">85㎡ 초과</option></select></div>
        </div>
        <label class="chk"><input type="checkbox" id="temp2"><span>일시적 2주택 (종전 주택을 기한 안에 처분)</span></label>
        <label class="chk"><input type="checkbox" id="firstCut" checked><span>생애최초 취득세 감면 (본인·배우자 무주택, 12억 이하)</span></label>
        <label class="chk"><input type="checkbox" id="vat"><span>중개보수에 부가세 10% 더하기 (일반과세 중개사무소)</span></label>
        <div class="row"><div><label class="f" for="loanAmt">대출 금액 <small>(인지세용, 비우면 한도 결과)</small></label><input type="text" id="loanAmt" class="m" inputmode="numeric"></div><div><label class="f" for="brokerRate">중개보수 협의 요율 (%) <small>(비우면 상한)</small></label><input type="number" id="brokerRate" step="0.01" inputmode="decimal"></div></div>
      </section>
      <section class="card">
        <h2>취득 비용</h2>
        <div class="stat" id="cStat"></div>
        <table class="t" id="cTbl"></table>
        <div class="actions"><button type="button" id="cCopy">결과 복사</button></div>
      </section>
    </div>

    <!-- 전월세 -->
    <div data-pane="rent" class="hidden">
      <section class="card">
        <h2><span class="num">2</span>전월세 전환</h2>
        <div class="row">
          <div><label class="f" for="base">한국은행 기준금리 (%)</label><input type="number" id="base" step="0.01" inputmode="decimal"></div>
          <div><label class="f" for="conv">적용 전환율 (%) <small>(비우면 법정 상한)</small></label><input type="number" id="conv" step="0.01" inputmode="decimal"></div>
        </div>
        <p class="hint" id="convInfo"></p>
        <div class="row3">
          <div><label class="f" for="dep0">지금 보증금 (전세금)</label><input type="text" id="dep0" class="m" inputmode="numeric" placeholder="예: 300,000,000"></div>
          <div><label class="f" for="dep1">바꿀 보증금</label><input type="text" id="dep1" class="m" inputmode="numeric" placeholder="예: 100,000,000"></div>
          <div><label class="f" for="rent0">지금 월세 <small>(있으면)</small></label><input type="text" id="rent0" class="m" inputmode="numeric" placeholder="0"></div>
        </div>
        <div class="stat" id="rStat"></div>
        <table class="t" id="rTbl"></table>
      </section>
    </div>
  </div>
